name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: pi/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build WASM HUD core
        run: |
          chmod +x scripts/build-wasm.sh
          ./scripts/build-wasm.sh
          mkdir -p site/public/emulator
          cp web/emulator/motohud.wasm site/public/emulator/motohud.wasm
          cp web/emulator/wasm_exec.js site/public/emulator/wasm_exec.js

      - name: Sync static assets
        run: |
          mkdir -p site/public/enclosure site/public/emulator/routes
          cp enclosure/exports/assembly.glb site/public/enclosure/assembly.glb
          cp web/emulator/routes/whitehall-farringdon.json site/public/emulator/routes/

      - name: Install and build site
        working-directory: site
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
