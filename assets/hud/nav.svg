<svg xmlns="http://www.w3.org/2000/svg" width="250" height="122" viewBox="0 0 250 122">
  <rect width="250" height="122" fill="#fff"/>

  <g id="main" transform="translate(4,3)">
    <text id="mode" x="0" y="11" data-pixel="6x12" font-size="12" fill="#000">NAV</text>
    <g id="link" transform="translate(168,1)">{{link_mark}}</g>
    {{nav_content}}
  </g>

  <line x1="206" y1="3" x2="206" y2="119" stroke="#000" stroke-width="1"/>
  <text id="leg_prev" x="246" y="14" text-anchor="end" data-pixel="6x12" font-size="12" fill="#000">{{leg_prev}}</text>
  <text id="leg_action" x="246" y="64" text-anchor="end" data-pixel="6x12" font-size="12" fill="#000">{{leg_action}}</text>
  <text id="leg_next" x="246" y="114" text-anchor="end" data-pixel="6x12" font-size="12" fill="#000">{{leg_next}}</text>
</svg>
